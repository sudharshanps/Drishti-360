services:
  postgres:
    image: postgres:16-alpine
    container_name: drishti360-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drishti360}
      POSTGRES_USER: ${POSTGRES_USER:-drishti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drishti_dev_pass}
    ports:
      - "5432:5432"
    volumes:
      - drishti_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drishti} -d ${POSTGRES_DB:-drishti360}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drishti360-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-drishti}:${POSTGRES_PASSWORD:-drishti_dev_pass}@postgres:5432/${POSTGRES_DB:-drishti360}
      SECRET_KEY: ${SECRET_KEY:-drishti360-docker-dev-secret-key}
      PUBLIC_VERIFY_BASE_URL: ${PUBLIC_VERIFY_BASE_URL:-http://localhost:5173/verify}
      AGMARKNET_API_KEY: ${AGMARKNET_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./drishti-360-logo.jpg:/app/assets/drishti-360-logo.jpg:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: drishti360-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  drishti_pgdata:
