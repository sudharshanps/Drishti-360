databases:
  - name: drishti360-db
    databaseName: drishti360
    user: drishti
    plan: free

services:
  - type: web
    name: drishti360-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: API_PREFIX
        value: /api
      - key: ENABLE_DOCS
        value: "false"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: drishti360-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://frontend-delta-ecru-38.vercel.app
      - key: CORS_ORIGINS
        value: https://frontend-delta-ecru-38.vercel.app
      - key: PUBLIC_VERIFY_BASE_URL
        value: https://frontend-delta-ecru-38.vercel.app/verify
      - key: AGMARKNET_API_KEY
        sync: false
